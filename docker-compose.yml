# Usage: docker compose up -d
# Game:   http://localhost:8080
# Server: ws://localhost:3000  (or set WS URL in the lobby to ws://localhost:3000)
services:

  # ── Static file server ─────────────────────────────────────────
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro

  # ── Node.js WebSocket + Kafka server ──────────────────────────
  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      # Valkey connection string (Aiven exposes this as the service URI).
      # Local docker Valkey has no auth/TLS, so a plain redis:// URI.
      VALKEY_URI: redis://valkey:6379
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ── Kafka (KRaft, no Zookeeper) ────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valkey (ephemeral leaderboard store) ───────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (scrapes the Aiven crab-race-valkey metrics) ────
  # Config + CA are generated by scripts/setup-prometheus.sh (run it first).
  # UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/ca.pem:/etc/prometheus/ca.pem:ro

  # Low-memory alerting is handled by scripts/check-valkey-memory.sh (run on a
  # cron/interval), which polls Prometheus and notifies Signal via Apprise. We
  # don't run Alertmanager: this Apprise server's webhook field-remap doesn't
  # work, but a plain-body POST does — see the script header.
