# Usage: docker compose up -d   (or: mise run up)
# Game:   http://localhost:8080  (nginx → server; game, /event/<slug>, API and WS)
# Server: http://localhost:3000  (direct, same app — used by the e2e tests)
#
# Networking: only the two things a player's browser talks to are published,
# and only on loopback (127.0.0.1) — web (:8080) and server (:3000). Kafka,
# Valkey, Postgres and Prometheus live on the `backend` network, which is
# `internal: true`: no published ports, no route to the host or the internet.
# They're reachable only by name from other containers on that network.
#
# To poke at a backing service, exec into it instead of opening a port:
#   docker compose exec postgres psql -U crab crabrace
#   docker compose exec valkey valkey-cli
#   docker compose exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
# (or the mise tasks: db:psql, valkey:cli, kafka:topics, kafka:consent)

networks:
  # Browser-facing: web + server. Has normal outbound access so the server can
  # reach external APIs (the Inkless leaderboard service for events).
  frontend: {}
  # Data plane: no host ports, no egress. Kafka/Valkey/Postgres never leave it.
  backend:
    internal: true
  # Prometheus scrapes Aiven-hosted Valkey metrics, so it needs egress — but it
  # still gets no published port and no access to `backend`.
  monitoring: {}

services:

  # ── nginx reverse proxy → server ───────────────────────────────
  # Proxies everything to server:3000 (see nginx.conf). Deliberately does NOT
  # mount the project directory: that exposed fnox.toml, prometheus/*.yml
  # (live creds) and .git to anyone who could reach :8080.
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    networks: [frontend]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [server]

  # ── Node.js WebSocket + Kafka server ──────────────────────────
  server:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    networks: [frontend, backend]
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      VALKEY_URI: redis://valkey:6379
      POSTGRES_URI: postgresql://crab:racing@postgres:5432/crabrace
      # Posts event race times to the leaderboard service (see .env.example).
      LEADERBOARD_TOKEN: ${LEADERBOARD_TOKEN:-}
      LEADERBOARD_URL: ${LEADERBOARD_URL:-}
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Kafka (KRaft, no Zookeeper) ────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    networks: [backend]
    expose: ["9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valkey (ephemeral leaderboard store) ───────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    networks: [backend]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (daily challenge ghost persistence) ─────────────
  postgres:
    image: postgres:16-alpine
    networks: [backend]
    expose: ["5432"]
    environment:
      POSTGRES_DB: crabrace
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: racing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crab -d crabrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (scrapes the Aiven crab-race-valkey metrics) ────
  # Config + CA are generated by scripts/setup-prometheus.sh (run it first).
  # No published port: query it from inside, e.g. scripts/check-valkey-memory.sh
  # runs its query via `docker compose exec prometheus wget …`.
  prometheus:
    image: prom/prometheus:latest
    networks: [monitoring]
    expose: ["9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/ca.pem:/etc/prometheus/ca.pem:ro

  # Low-memory alerting is handled by scripts/check-valkey-memory.sh (run on a
  # cron/interval), which polls Prometheus and notifies Signal via Apprise. We
  # don't run Alertmanager: this Apprise server's webhook field-remap doesn't
  # work, but a plain-body POST does — see the script header.
