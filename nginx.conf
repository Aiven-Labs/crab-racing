# nginx in front of the Node server. Serves nothing from disk — every request
# (game page, /event/<slug>, /api/*, WebSocket) is proxied to server:3000,
# which only ships the files baked into its image (see Dockerfile). This keeps
# the project directory (fnox.toml, prometheus/, .git, …) out of reach.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  location / {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;

    # WebSocket upgrade (multiplayer lives on the same origin).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;

    proxy_set_header Host              $host;
    # Overwrite (don't append) so a client can't spoof the IP the server's
    # rate limits key on.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
