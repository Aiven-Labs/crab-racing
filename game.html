<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Crab Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0f1e;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden; touch-action: none;
  }

  /* ── Lobby overlay ─────────────────────────────────── */
  #lobby {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0f1e;
    display: flex; justify-content: center; align-items: center;
    z-index: 10; font-family: monospace; color: #c0d8f0;
  }
  #lobby.hidden { display: none; }
  #lobby-inner {
    display: flex; flex-direction: column; gap: 12px;
    max-width: 340px; width: 90%; text-align: center;
  }
  #lobby h1   { font-size: 32px; color: #e8d030; text-shadow: 0 0 10px #a08000; letter-spacing: 2px; }
  #lobby .sub { font-size: 13px; color: #6090a8; letter-spacing: 1px; }
  #lobby button {
    background: #111e30; border: 2px solid #2a5070; color: #a0c8e8;
    font-family: monospace; font-size: 16px; padding: 12px 16px;
    cursor: pointer; letter-spacing: 1px; width: 100%;
  }
  #lobby button:hover { background: #1a2e48; border-color: #4a90c0; color: #d0e8f8; }
  #lobby input {
    background: #0e1828; border: 1px solid #1e3850; color: #c0d8f0;
    font-family: monospace; font-size: 16px; padding: 10px 10px; width: 100%;
    outline: none;
  }
  #lobby input:focus { border-color: #3a7090; }
  #lobby hr    { border: none; border-top: 1px solid #1e3050; margin: 2px 0; }
  #lobby-status { font-size: 13px; color: #5898b8; min-height: 16px; }
  #player-list  { font-size: 13px; min-height: 16px; letter-spacing: 1px; }
  #multi-section { display: flex; flex-direction: column; gap: 6px; }
  .lrow { display: flex; gap: 6px; }
  .lrow input  { flex: 1; }
  .lrow button { flex: 0 0 auto; width: auto; padding: 6px 12px; }

  /* ── Leaderboard ───────────────────────────────────── */
  #leaderboard { font-family: monospace; color: #c0d8f0; }
  #leaderboard h2 {
    font-size: 13px; color: #e8d030; letter-spacing: 2px;
    margin-bottom: 6px; text-transform: uppercase;
  }
  #lb-list { list-style: none; font-size: 13px; }
  #lb-list li {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 3px 4px; border-bottom: 1px solid #16283c;
  }
  #lb-list .lb-swatch {
    flex: 0 0 auto; width: 10px; height: 10px; border-radius: 2px;
    align-self: center; border: 1px solid #0006;
  }
  #lb-list .lb-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb-list .lb-time { flex: 0 0 auto; color: #7ec8e3; font-variant-numeric: tabular-nums; }
  #lb-empty { font-size: 12px; color: #567; }
</style>
</head>
<body>

<!-- ── Lobby ─────────────────────────────────────────── -->
<div id="lobby">
  <div id="lobby-inner">
    <h1>🦀 CRAB RACING</h1>
    <div class="sub">COASTAL SURVIVAL RACE</div>
    <input id="seed-code" placeholder="Obstacle seed (blank = random)" maxlength="32">
    <button id="btn-solo">Solo Race</button>
    <hr>
    <div id="multi-section">
      <input id="player-name" placeholder="Your name"   value="Crab"  maxlength="16">
      <input id="room-code"   placeholder="Room code"   value="room1" maxlength="24">
      <div class="lrow">
        <input id="ws-url" placeholder="Server" value="wss://019f1e27-36cc-7ce0-9389-8428b196d1e7-3000.eur-1.aiven.app">
        <button id="btn-multi">Join</button>
      </div>
    </div>
    <div id="lobby-status">Enter a name &amp; room, then Join</div>
    <div id="player-list"></div>
    <hr>
    <div id="leaderboard">
      <h2>🏆 Fastest Crabs</h2>
      <ol id="lb-list"></ol>
      <div id="lb-empty">No times yet — be the first!</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
'use strict';

// ─── multiplayer globals ───────────────────────────────────────────────────────
let ws           = null;
let myPlayerId   = null;
let myColorIdx   = 0;
let multiMode    = false;
let multiPlayers = [];    // player list received with 'go' message
let gameScene    = null;  // set by RaceScene.create()

const CRAB_PALETTES = [
  ['#4a80a0', '#68a0c0', '#3870a0', '#90c0d8'], // 0 blue (default)
  ['#a04030', '#c06050', '#903020', '#d09080'], // 1 red
  ['#408030', '#60a050', '#307020', '#80c070'], // 2 green
  ['#804090', '#a060b0', '#703080', '#c090d0'], // 3 purple
];
const PALETTE_HEX = ['#68a0c0', '#c06050', '#60a050', '#a060b0'];

// ─── pixel art helpers ─────────────────────────────────────────────────────────
function px(ctx,x,y,c)         { ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }
function hline(ctx,x1,x2,y,c) { ctx.fillStyle=c; ctx.fillRect(x1,y,x2-x1+1,1); }
function vline(ctx,x,y1,y2,c) { ctx.fillStyle=c; ctx.fillRect(x,y1,1,y2-y1+1); }
function rect(ctx,x,y,w,h,c)  { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function ellipse(ctx,cx,cy,rx,ry,c) {
  for (let dy=-ry; dy<=ry; dy++)
    for (let dx=-rx; dx<=rx; dx++)
      if (dx*dx/(rx*rx)+dy*dy/(ry*ry)<=1) px(ctx,cx+dx,cy+dy,c);
}
function circle(ctx,cx,cy,r,c) { ellipse(ctx,cx,cy,r,r,c); }

function makeCanvas(w,h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return { canvas: c, ctx };
}

// ─── terrain tile generators (32×32) ──────────────────────────────────────────
function drawShore(ctx) {
  rect(ctx,0,0,32,32,'#d4c898');
  for (let i=0; i<32; i+=4) hline(ctx,0,31,i,'#c8bc88');
  rect(ctx,0,27,32,5,'#6898b8');
  hline(ctx,3,28,28,'#88b8d0');
}
function drawWetSand(ctx) {
  rect(ctx,0,0,32,32,'#b89a58');
  for (let y=0; y<32; y+=5) hline(ctx,2,29,y,'#a88848');
  ellipse(ctx,18,20,7,4,'#6888a8');
}
function drawDrySand(ctx) {
  rect(ctx,0,0,32,32,'#e0c870');
  px(ctx,7,7,'#c8a858'); px(ctx,19,17,'#c8a858');
  px(ctx,13,25,'#c8a858'); px(ctx,25,5,'#c8a858');
}
function drawUndergrowth(ctx) {
  rect(ctx,0,0,32,32,'#587038');
  circle(ctx,7,8,4,'#78a040'); circle(ctx,24,20,5,'#689038');
  circle(ctx,18,7,3,'#88b048'); circle(ctx,5,24,4,'#78a040');
}
function drawTreeline(ctx) {
  rect(ctx,0,0,32,32,'#2a3020');
  circle(ctx,9,10,7,'#384828'); circle(ctx,23,22,7,'#304020');
  circle(ctx,25,8,5,'#405830'); circle(ctx,5,23,5,'#384828');
}
function drawFinish(ctx) {
  for (let y=0; y<32; y++)
    for (let x=0; x<32; x++)
      px(ctx,x,y, ((Math.floor(x/4)+Math.floor(y/4))%2===0) ? '#f0f0e0' : '#202020');
}

// ─── spider crab sprite sheet (128×32, 4 walk frames) ─────────────────────────
// palette = [body, bodyHighlight, leg, tip]  — defaults to blue
function makeCrabSheet(palette) {
  const [BODY, BODYH, LEG, TIP] = palette || CRAB_PALETTES[0];
  const { canvas, ctx } = makeCanvas(128, 32);

  for (let f = 0; f < 4; f++) {
    const ox    = f * 32;
    const phase = f * Math.PI / 2;

    for (let i = 0; i < 4; i++) {
      const legY = 8 + i * 5;
      const lLen = 5 + Math.round(2 * Math.sin(phase + i * 0.9));
      const rLen = 5 + Math.round(2 * Math.sin(phase + i * 0.9 + Math.PI));
      hline(ctx, ox+9-lLen, ox+9,       legY, LEG);
      hline(ctx, ox+22,     ox+22+rLen,  legY, LEG);
      px(ctx, ox+9-lLen,  legY, TIP);
      px(ctx, ox+22+rLen, legY, TIP);
    }
    ellipse(ctx, ox+16, 16, 6, 10, BODY);
    ellipse(ctx, ox+15, 14,  4,  7, BODYH);
    px(ctx, ox+21, 11, '#f0f0f0'); px(ctx, ox+22, 11, '#202020');
    px(ctx, ox+21, 21, '#f0f0f0'); px(ctx, ox+22, 21, '#202020');
    hline(ctx, ox+11, ox+21, 3,  LEG);
    hline(ctx, ox+12, ox+20, 4,  BODY);
    hline(ctx, ox+11, ox+21, 5,  LEG);
    hline(ctx, ox+11, ox+21, 27, LEG);
    hline(ctx, ox+12, ox+20, 28, BODY);
    hline(ctx, ox+11, ox+21, 29, LEG);
  }
  return canvas;
}

// ─── obstacle sprite generators (32×32) ───────────────────────────────────────
function drawRock(ctx) {
  ellipse(ctx, 19, 20, 12, 9, '#706858');
  ellipse(ctx, 13, 16,  8, 6, '#908878');
  px(ctx, 11, 14, '#b8b0a0'); px(ctx, 12, 13, '#b8b0a0');
}
function drawHole(ctx) {
  circle(ctx, 16, 18, 11, '#3a2810');
  circle(ctx, 16, 18,  8, '#1e1408');
  circle(ctx, 16, 18,  4, '#080400');
  for (let a = 200; a <= 340; a += 25) {
    const r = a * Math.PI / 180;
    px(ctx, Math.round(16 + 11*Math.cos(r)), Math.round(18 + 11*Math.sin(r)), '#604828');
  }
}
function drawJelly(ctx) {
  ellipse(ctx, 16, 13, 10, 7, '#c050b8');
  ellipse(ctx, 16, 11,  6, 4, '#e890d8');
  for (let i = 0; i < 5; i++) {
    const x = 8 + i * 4;
    const len = 6 + (i % 2) * 3;
    vline(ctx, x, 20, 20 + len, '#a040a0');
    px(ctx, x, 20 + len, '#e070d0');
  }
}
function drawBeach(ctx) {
  vline(ctx, 16, 9, 26, '#c09060');
  for (let r = 0; r <= 8; r++)
    hline(ctx, 16-r, 16+r, 9+r, r%2===0 ? '#e02828' : '#f0f0f0');
  rect(ctx, 9, 22, 15, 6, '#3888d0');
  hline(ctx, 9, 23, 24, '#60a8f0');
}
function drawNet(ctx) {
  const C = '#b08838';
  for (let x = 4; x <= 28; x += 4) vline(ctx, x, 8, 24, C);
  for (let y = 8; y <= 24; y += 4) hline(ctx, 4, 28, y, C);
  for (let x = 4; x <= 28; x += 4)
    for (let y = 8; y <= 24; y += 4)
      px(ctx, x, y, '#d0a850');
}

// ─── obstacle generation ───────────────────────────────────────────────────────
// Obstacles are placed procedurally from a seed so that every race gets a fresh
// but fair layout. The server is authoritative in multiplayer and shares its seed
// with all clients (via the 'joined'/'go' messages) so everyone renders and
// simulates the exact same track. Solo races seed from the lobby (custom or random).
//
// IMPORTANT: this generator must stay byte-for-byte identical to the one in
// server.js — the same seed must produce the same obstacles on both sides.
const OBSTACLE_KINDS = [
  { type: 'hole',  effect: 'stun',  turns: 2, msg: 'FELL IN A HOLE!'     },
  { type: 'jelly', effect: 'stun',  turns: 1, msg: 'STUNG!'              },
  { type: 'rock',  effect: 'block',            msg: 'BLOCKED BY ROCK!'    },
  { type: 'beach', effect: 'push',             msg: 'TOURIST KICKED YOU!' },
  { type: 'net',   effect: 'stun',  turns: 1, msg: 'TANGLED IN A NET!'   },
];

// xmur3 string hash → 32-bit int (lets custom seeds be arbitrary strings)
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

// mulberry32 — small deterministic PRNG seeded by a 32-bit int
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Deterministically place obstacles. At most one per cell column, so at least
// two lanes are always open — the track is never fully blocked.
function generateObstacles(seed, opts) {
  const { totalCells, lanes, startCell, finishCell, density = 0.38 } = opts;
  const seedNum = typeof seed === 'number' ? (seed >>> 0) : hashSeed(String(seed));
  const rng = mulberry32(seedNum);
  const list = [];
  for (let cell = startCell; cell < finishCell - 1; cell++) {
    if (rng() >= density) continue;
    const lane = Math.floor(rng() * lanes);
    const kind = OBSTACLE_KINDS[Math.floor(rng() * OBSTACLE_KINDS.length)];
    list.push({ cell, lane, ...kind });
  }
  return list;
}

// Filled in by buildObstacles() once the seed for the race is known.
let OBSTACLES = [];
let OBS_MAP   = new Map();
let raceSeed  = null;

function buildObstacles(seed) {
  raceSeed  = seed;
  OBSTACLES = generateObstacles(seed, {
    totalCells: TOTAL_CELLS, lanes: LANES, startCell: 6, finishCell: FINISH_CELL,
  });
  OBS_MAP = new Map(OBSTACLES.map(o => [`${o.cell},${o.lane}`, o]));
}

// ─── track ────────────────────────────────────────────────────────────────────
const CELL  = 32;   // texture cell size in source pixels
const LANES = 3;

// ─── render resolution ──────────────────────────────────────────────────────────
// The game world is laid out in a 480×270 logical space, but we render into a
// framebuffer scaled up by RES so that text has enough real pixels to stay crisp
// once Scale.FIT stretches it across a high-DPI display. Pixel-art sprites are
// drawn at RES× with nearest-neighbour filtering, so they stay perfectly sharp.
const BASE_W = 480, BASE_H = 270;
const RES    = Math.max(2, Math.min(4,
  Math.round((window.innerHeight * (window.devicePixelRatio || 1)) / BASE_H)
));
const CELLR  = CELL * RES;              // on-screen cell size
const fs     = (n) => `${Math.round(n * RES)}px`;   // logical font size → device px
const ZONES = [
  { tile: 'shore',       len: 5  },
  { tile: 'wetSand',     len: 8  },
  { tile: 'drySand',     len: 12 },
  { tile: 'undergrowth', len: 10 },
  { tile: 'treeline',    len: 8  },
  { tile: 'finish',      len: 3  },
];
const TRACK       = [];
for (const z of ZONES) for (let i = 0; i < z.len; i++) TRACK.push(z.tile);
const TOTAL_CELLS = TRACK.length;
const FINISH_CELL = TOTAL_CELLS - ZONES.at(-1).len;

// ─── lobby / WebSocket ────────────────────────────────────────────────────────
function $id(id) { return document.getElementById(id); }
function setStatus(t) { $id('lobby-status').textContent = t; }
function setPlayerList(players) {
  $id('player-list').innerHTML = players
    .map(p => `<span style="color:${PALETTE_HEX[p.colorIdx]}">${p.name}</span>`)
    .join(' · ');
}

function handleServerMsg(msg) {
  switch (msg.type) {
    case 'joined':
      myPlayerId = msg.playerId;
      myColorIdx = msg.colorIdx;
      if (msg.seed != null) buildObstacles(msg.seed);
      setStatus(`Lobby · ${msg.players.length} player(s) — waiting… (seed ${msg.seed})`);
      setPlayerList(msg.players);
      break;
    case 'player-joined':
      setStatus(`${msg.players.length} player(s) ready`);
      setPlayerList(msg.players);
      break;
    case 'countdown':
      setStatus(`Starting in ${msg.count}…`);
      break;
    case 'go':
      multiPlayers = msg.players;
      if (msg.seed != null) buildObstacles(msg.seed); // authoritative seed for the race
      $id('lobby').classList.add('hidden');
      startGame(true);
      break;
    case 'state':
      if (gameScene) gameScene.applyServerState(msg.players, msg.result, msg.movedId);
      break;
    case 'win':
      if (gameScene) {
        if (msg.playerId === myPlayerId) gameScene.onWin();
        else gameScene.onOtherWin(msg.name);
      }
      break;
    case 'player-left':
      if (gameScene) gameScene.onPlayerLeft(msg.playerId);
      break;
    case 'error':
      setStatus(`⚠ ${msg.msg}`);
      break;
  }
}

// ─── leaderboard (HTTP; works in solo + multi) ────────────────────────────────
// The board lives on the server behind /leaderboard. Derive its HTTP origin from
// the WebSocket URL field so one input drives both (ws→http, wss→https).
function leaderboardBase() {
  const raw = $id('ws-url').value.trim() || location.origin;
  try {
    const u = new URL(raw);
    if (u.protocol === 'ws:')  u.protocol = 'http:';
    if (u.protocol === 'wss:') u.protocol = 'https:';
    return u.origin;
  } catch { return location.origin; }
}

// centiseconds → "m:ss.cc"
function fmtTime(cs) {
  const c = cs % 100, sec = Math.floor(cs / 100), m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')}.${c.toString().padStart(2,'0')}`;
}

function renderLeaderboard(board) {
  const list  = $id('lb-list');
  const empty = $id('lb-empty');
  if (!list) return;
  if (!board || board.length === 0) {
    list.innerHTML = '';
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';
  list.innerHTML = board.map(row => {
    const hex = PALETTE_HEX[row.colorIdx] || PALETTE_HEX[0];
    return `<li><span class="lb-swatch" style="background:${hex}"></span>` +
           `<span class="lb-name" style="color:${hex}">${escapeHtml(row.name)}</span>` +
           `<span class="lb-time">${fmtTime(row.timeCs)}</span></li>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function fetchLeaderboard() {
  try {
    const res = await fetch(`${leaderboardBase()}/leaderboard`);
    if (res.ok) renderLeaderboard(await res.json());
  } catch { /* server may be down — leave the board as-is */ }
}

// Record a finish; returns the updated board (or null on failure).
async function submitScore(name, timeCs, colorIdx) {
  try {
    const res = await fetch(`${leaderboardBase()}/leaderboard`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, timeCs, colorIdx }),
    });
    if (res.ok) { const board = await res.json(); renderLeaderboard(board); return board; }
  } catch { /* offline — score just isn't recorded */ }
  return null;
}

// Read the seed input: blank → random seed, otherwise the custom string.
function readSeedInput() {
  const raw = $id('seed-code').value.trim();
  return raw || String(Math.floor(Math.random() * 0xffffffff));
}

function startSolo() {
  buildObstacles(readSeedInput());
  $id('lobby').classList.add('hidden');
  startGame(false);
}

function joinMulti() {
  const wsUrl  = $id('ws-url').value.trim()     || 'ws://localhost:3000';
  const name   = $id('player-name').value.trim() || 'Crab';
  const roomId = $id('room-code').value.trim()   || 'room1';
  const seed   = $id('seed-code').value.trim()   || undefined; // blank → server picks
  setStatus('Connecting…');
  try { ws = new WebSocket(wsUrl); }
  catch (e) { setStatus(`Bad URL: ${e.message}`); return; }
  ws.onopen    = () => ws.send(JSON.stringify({ type: 'join', name, roomId, seed }));
  ws.onmessage = e  => handleServerMsg(JSON.parse(e.data));
  ws.onerror   = ()  => setStatus('Connection failed — is the server running?');
  ws.onclose   = ()  => { if (gameScene?.statusText) gameScene.statusText.setText('Disconnected'); };
}

function startGame(isMulti) {
  multiMode = isMulti;
  if (window._phaserGame) return; // guard against double-init
  window._phaserGame = new Phaser.Game({
    type:            Phaser.AUTO,
    width:           BASE_W * RES,
    height:          BASE_H * RES,
    backgroundColor: '#1a2030',
    pixelArt:        true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: RaceScene,
  });
}

$id('btn-solo').onclick  = startSolo;
$id('btn-multi').onclick = joinMulti;

// Show the leaderboard on the home page right away, and refresh it whenever the
// server field changes (so it points at whichever server you'll actually play on).
fetchLeaderboard();
$id('ws-url').addEventListener('change', fetchLeaderboard);

// ─── Phaser scene ─────────────────────────────────────────────────────────────
class RaceScene extends Phaser.Scene {
  constructor() { super('Race'); }

  // No preload — all textures created synchronously in create()
  create() {
    gameScene = this;

    // ── tile textures ──────────────────────────────────────────
    const tileDrawers = { shore: drawShore, wetSand: drawWetSand, drySand: drawDrySand,
                          undergrowth: drawUndergrowth, treeline: drawTreeline, finish: drawFinish };
    for (const [key, fn] of Object.entries(tileDrawers)) {
      if (!this.textures.exists(key)) {
        const { canvas, ctx } = makeCanvas(32, 32); fn(ctx);
        this.textures.addCanvas(key, canvas);
      }
    }

    // ── obstacle textures ──────────────────────────────────────
    const obDrawers = { rock: drawRock, hole: drawHole, jelly: drawJelly,
                        beach: drawBeach, net: drawNet };
    for (const [key, fn] of Object.entries(obDrawers)) {
      const tkey = 'ob_' + key;
      if (!this.textures.exists(tkey)) {
        const { canvas, ctx } = makeCanvas(32, 32); fn(ctx);
        this.textures.addCanvas(tkey, canvas);
      }
    }

    // ── scene state ────────────────────────────────────────────
    const { width: W, height: H } = this.scale;
    const trackTop = Math.floor((H - LANES * CELLR) / 2);
    this.trackTop     = trackTop;
    this.busy         = false;
    this.won          = false;
    this.stunTurns    = 0;
    this.raceTime     = 0;
    this.timerStarted = false;
    this.timerEvent   = null;

    // ── terrain ────────────────────────────────────────────────
    for (let cx = 0; cx < TOTAL_CELLS; cx++)
      for (let lane = 0; lane < LANES; lane++)
        this.add.image(cx * CELLR + CELLR/2, trackTop + lane * CELLR + CELLR/2, TRACK[cx])
          .setScale(RES);

    const gfx = this.add.graphics();
    gfx.fillStyle(0x000000);
    gfx.fillRect(0, trackTop - 2*RES,           TOTAL_CELLS * CELLR, 2*RES);
    gfx.fillRect(0, trackTop + LANES * CELLR,    TOTAL_CELLS * CELLR, 2*RES);

    // ── obstacles ──────────────────────────────────────────────
    this.obSprites = new Map();
    for (const o of OBSTACLES) {
      const spr = this.add.image(
        o.cell * CELLR + CELLR/2, trackTop + o.lane * CELLR + CELLR/2, 'ob_' + o.type
      ).setScale(RES);
      this.obSprites.set(`${o.cell},${o.lane}`, spr);
    }

    // ── crabs: solo vs multiplayer ─────────────────────────────
    if (multiMode) {
      this._setupMultiCrabs(trackTop);
    } else {
      this._setupSoloCrab(trackTop);
    }

    this.cameras.main.setBounds(0, 0, TOTAL_CELLS * CELLR, H);
    this.cameras.main.startFollow(this.crab, true, 0.1, 1);
    this.cameras.main.setDeadzone(60 * RES, H);

    // ── HUD ────────────────────────────────────────────────────
    this.hudText = this.add.text(8 * RES, 8 * RES, '', {
      fontFamily: 'monospace', fontSize: fs(12),
      color: '#7ec8e3', stroke: '#000', strokeThickness: 3,
    }).setScrollFactor(0);

    this.statusText = this.add.text(W / 2, 8 * RES, '', {
      fontFamily: 'monospace', fontSize: fs(12),
      color: '#ff6060', stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5, 0).setScrollFactor(0);

    this.timerText = this.add.text(W - 8 * RES, 8 * RES, multiMode ? '' : '0:00.00', {
      fontFamily: 'monospace', fontSize: fs(12),
      color: '#e8e030', stroke: '#000', strokeThickness: 3,
    }).setOrigin(1, 0).setScrollFactor(0);

    this.add.text(W / 2, H - 6 * RES, 'tap / → move   swipe ↑↓ shift lane   (WASD / arrows)', {
      fontFamily: 'monospace', fontSize: fs(10),
      color: '#ffffff', stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5, 1).setScrollFactor(0);

    // ── input ──────────────────────────────────────────────────
    this.input.keyboard.on('keydown-SPACE', () => this.move( 1,  0));
    this.input.keyboard.on('keydown-RIGHT', () => this.move( 1,  0));
    this.input.keyboard.on('keydown-LEFT',  () => this.move(-1,  0));
    this.input.keyboard.on('keydown-UP',    () => this.move( 0, -1));
    this.input.keyboard.on('keydown-DOWN',  () => this.move( 0,  1));
    this.input.keyboard.on('keydown-W',     () => this.move( 0, -1));
    this.input.keyboard.on('keydown-S',     () => this.move( 0,  1));
    this.input.keyboard.on('keydown-A',     () => this.move(-1,  0));
    this.input.keyboard.on('keydown-D',     () => this.move( 1,  0));
    // Touch / mouse: tap = move forward, vertical swipe = shift lane
    this._swipe = null;
    this.input.on('pointerdown', (p) => { this._swipe = { x: p.x, y: p.y }; });
    this.input.on('pointerup', (p) => {
      const s = this._swipe;
      this._swipe = null;
      if (!s) return;
      const dx = p.x - s.x;
      const dy = p.y - s.y;
      const SWIPE = 24; // px threshold in screen space
      if (Math.abs(dy) > SWIPE && Math.abs(dy) > Math.abs(dx)) {
        this.move(0, dy < 0 ? -1 : 1);        // swipe up / down shifts lane
      } else {
        this.move(1, 0);                       // tap (or horizontal) moves forward
      }
    });

    this.refreshHUD();
  }

  // ── crab setup helpers ─────────────────────────────────────────────────────
  _setupSoloCrab(trackTop) {
    this.cell = 0;
    this.lane = Math.floor(LANES / 2);

    const key = 'crab_0';
    if (!this.textures.exists(key)) {
      const tex = this.textures.addCanvas(key, makeCrabSheet(CRAB_PALETTES[0]));
      for (let i = 0; i < 4; i++) tex.add(i, 0, i * 32, 0, 32, 32);
    }
    this.crab = this.add.sprite(CELLR/2, trackTop + this.lane * CELLR + CELLR/2, key)
      .setFrame(0).setScale(RES);

    if (!this.anims.exists('walk_0')) {
      this.anims.create({
        key: 'walk_0',
        frames: [0,1,2,3].map(i => ({ key, frame: i })),
        frameRate: 10, repeat: -1,
      });
    }
  }

  _setupMultiCrabs(trackTop) {
    this.playerCrabs  = new Map(); // playerId → Sprite
    this.playerLabels = new Map(); // playerId → Text

    for (const p of multiPlayers) {
      const key = `crab_${p.colorIdx}`;
      if (!this.textures.exists(key)) {
        const tex = this.textures.addCanvas(key, makeCrabSheet(CRAB_PALETTES[p.colorIdx]));
        for (let i = 0; i < 4; i++) tex.add(i, 0, i * 32, 0, 32, 32);
      }
      if (!this.anims.exists('walk_' + p.colorIdx)) {
        this.anims.create({
          key: 'walk_' + p.colorIdx,
          frames: [0,1,2,3].map(i => ({ key, frame: i })),
          frameRate: 10, repeat: -1,
        });
      }

      const sx = p.cell * CELLR + CELLR/2;
      const sy = trackTop + p.lane * CELLR + CELLR/2;
      const spr = this.add.sprite(sx, sy, key).setFrame(0).setScale(RES);
      const lbl = this.add.text(sx, sy - 10 * RES, p.name, {
        fontFamily: 'monospace', fontSize: fs(9),
        color: PALETTE_HEX[p.colorIdx], stroke: '#000', strokeThickness: 3,
      }).setOrigin(0.5, 1);

      this.playerCrabs.set(p.id, spr);
      this.playerLabels.set(p.id, lbl);
    }

    const myP  = multiPlayers.find(p => p.id === myPlayerId) ?? multiPlayers[0];
    this.crab  = this.playerCrabs.get(myP.id);
    this.cell  = myP.cell;
    this.lane  = myP.lane;
  }

  // ── move ──────────────────────────────────────────────────────────────────
  move(dx, dlane) {
    if (this.busy || this.won) return;

    // MULTIPLAYER: send to server; applyServerState() handles the result
    if (multiMode) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'move', dx, dlane }));
      }
      return;
    }

    // SOLO: local authoritative logic (unchanged from original)
    if (!this.timerStarted) {
      this.timerStarted = true;
      this.timerEvent = this.time.addEvent({
        delay: 10, loop: true,
        callback: () => {
          this.raceTime++;
          const cs  = this.raceTime % 100;
          const sec = Math.floor(this.raceTime / 100);
          const m   = Math.floor(sec / 60), s = sec % 60;
          this.timerText.setText(
            `${m}:${s.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`
          );
        },
      });
    }

    if (this.stunTurns > 0) {
      this.stunTurns--;
      this.cameras.main.shake(120, 0.006);
      const left = this.stunTurns;
      this.statusText.setText(left > 0 ? `STUNNED — ${left} turn${left > 1 ? 's' : ''} left` : 'RECOVERED!');
      if (left === 0) this.time.delayedCall(600, () => this.statusText.setText(''));
      return;
    }

    const nextCell = this.cell + dx;
    const nextLane = this.lane + dlane;
    if (nextCell < 0 || nextCell >= TOTAL_CELLS) return;
    if (nextLane < 0 || nextLane >= LANES) return;

    const obs = OBS_MAP.get(`${nextCell},${nextLane}`);
    if (obs?.effect === 'block') {
      this.cameras.main.shake(100, 0.008);
      this.statusText.setText(obs.msg);
      this.time.delayedCall(800, () => this.statusText.setText(''));
      return;
    }

    this.busy = true;
    if (dx !== 0) this.crab.play('walk_0');

    this.tweens.add({
      targets:  this.crab,
      x:        nextCell * CELLR + CELLR/2,
      y:        this.trackTop + nextLane * CELLR + CELLR/2,
      duration: 160, ease: 'Linear',
      onComplete: () => {
        this.cell = nextCell;
        this.lane = nextLane;
        this.busy = false;

        if (obs) {
          if (obs.effect === 'stun') {
            this.stunTurns = obs.turns;
            this.statusText.setText(obs.msg);
            this.cameras.main.flash(200, 255, 80, 0);
          } else if (obs.effect === 'push') {
            this.statusText.setText(obs.msg);
            this.cameras.main.shake(150, 0.01);
            this.time.delayedCall(200, () => {
              const pushCell = Math.max(0, this.cell - 1);
              this.tweens.add({
                targets: this.crab, x: pushCell * CELLR + CELLR/2, duration: 120,
                ease: 'Linear', onComplete: () => { this.cell = pushCell; this.refreshHUD(); }
              });
            });
            this.time.delayedCall(900, () => this.statusText.setText(''));
          }
        }

        this.refreshHUD();
        if (this.cell >= FINISH_CELL) {
          this.onWin();
        } else {
          this.crab.stop();
          this.crab.setFrame(0);
        }
      },
    });
  }

  // ── applyServerState ────────────────────────────────────────────────────────
  // Called by handleServerMsg when server broadcasts updated game state
  applyServerState(players, result, movedId) {
    for (const p of players) {
      const spr = this.playerCrabs?.get(p.id);
      const lbl = this.playerLabels?.get(p.id);
      if (!spr) continue;

      const tx = p.cell * CELLR + CELLR/2;
      const ty = this.trackTop + p.lane * CELLR + CELLR/2;

      if (Math.abs(spr.x - tx) > 0.5 || Math.abs(spr.y - ty) > 0.5) {
        this.tweens.add({
          targets: spr, x: tx, y: ty, duration: 150, ease: 'Linear',
          onUpdate:  () => lbl?.setPosition(spr.x, spr.y - 10 * RES),
          onComplete: () => lbl?.setPosition(tx, ty - 10 * RES),
        });
      }

      if (p.id === myPlayerId) {
        this.cell      = p.cell;
        this.lane      = p.lane;
        this.stunTurns = p.stunTurns;
        this.refreshHUD();
      }
    }

    // Show feedback for my own move result
    if (result && movedId === myPlayerId) {
      const eff = result.effect;
      if (eff === 'block') {
        this.cameras.main.shake(100, 0.008);
        this.statusText.setText(result.msg || 'BLOCKED!');
        this.time.delayedCall(800, () => this.statusText.setText(''));
      } else if (eff === 'stunned') {
        this.cameras.main.shake(120, 0.006);
        const left = result.stunLeft ?? 0;
        this.statusText.setText(left > 0 ? `STUNNED — ${left} turn${left > 1 ? 's' : ''} left` : 'RECOVERED!');
        if (left === 0) this.time.delayedCall(600, () => this.statusText.setText(''));
      } else if (eff?.type === 'stun') {
        this.statusText.setText(eff.msg);
        this.cameras.main.flash(200, 255, 80, 0);
      } else if (eff?.type === 'push') {
        this.statusText.setText(eff.msg);
        this.cameras.main.shake(150, 0.01);
        this.time.delayedCall(900, () => this.statusText.setText(''));
      }
    }
  }

  // ── onPlayerLeft ────────────────────────────────────────────────────────────
  onPlayerLeft(playerId) {
    this.playerCrabs?.get(playerId)?.destroy();
    this.playerLabels?.get(playerId)?.destroy();
    this.playerCrabs?.delete(playerId);
    this.playerLabels?.delete(playerId);
    this.statusText.setText('A player left the race');
    this.time.delayedCall(1500, () => this.statusText.setText(''));
  }

  // ── refreshHUD ──────────────────────────────────────────────────────────────
  refreshHUD() {
    const zone = TRACK[Math.min(this.cell, TOTAL_CELLS - 1)];
    const pct  = Math.min(100, Math.round(this.cell / FINISH_CELL * 100));
    const fill = Math.round(pct / 10);
    const bar  = '█'.repeat(fill) + '░'.repeat(10 - fill);
    this.hudText.setText(`${zone.toUpperCase()}  ${bar}  ${pct}%`);
  }

  // ── onWin ───────────────────────────────────────────────────────────────────
  onWin() {
    if (this.won) return;
    this.won = true;
    this.crab?.stop?.();
    this.crab?.setFrame?.(0);
    if (this.timerEvent) this.timerEvent.remove();

    const { width: W, height: H } = this.scale;

    // Record the finish on the shared leaderboard (name + time + crab colour).
    const playerName = ($id('player-name').value.trim() || 'Crab').slice(0, 20);
    submitScore(playerName, this.raceTime, myColorIdx);

    if (multiMode) {
      this.add.rectangle(W/2, H/2, 240*RES, 80*RES, 0x0a1828, 230).setScrollFactor(0);
      this.add.text(W/2, H/2 - 16*RES, '🦀  YOU WIN!  🦀', {
        fontFamily: 'monospace', fontSize: fs(20),
        color: '#e8e030', stroke: '#000', strokeThickness: 4,
      }).setOrigin(0.5).setScrollFactor(0);
      this.add.text(W/2, H/2 + 16*RES, 'refresh to race again', {
        fontFamily: 'monospace', fontSize: fs(11), color: '#7ec8e3',
        stroke: '#000', strokeThickness: 3,
      }).setOrigin(0.5).setScrollFactor(0);
    } else {
      const cs  = this.raceTime % 100;
      const sec = Math.floor(this.raceTime / 100);
      const m   = Math.floor(sec / 60), s = sec % 60;
      const timeStr = `${m}:${s.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;

      this.add.rectangle(W/2, H/2, 240*RES, 92*RES, 0x0a1828, 230).setScrollFactor(0);
      this.add.text(W/2, H/2 - 22*RES, '🦀  FINISH!  🦀', {
        fontFamily: 'monospace', fontSize: fs(20),
        color: '#e8e030', stroke: '#000', strokeThickness: 4,
      }).setOrigin(0.5).setScrollFactor(0);
      this.add.text(W/2, H/2 + 4*RES, `Time: ${timeStr}`, {
        fontFamily: 'monospace', fontSize: fs(13),
        color: '#ffffff', stroke: '#000', strokeThickness: 3,
      }).setOrigin(0.5).setScrollFactor(0);
      this.add.text(W/2, H/2 + 24*RES, 'tap or space to race again', {
        fontFamily: 'monospace', fontSize: fs(11), color: '#7ec8e3',
        stroke: '#000', strokeThickness: 3,
      }).setOrigin(0.5).setScrollFactor(0);

      this.time.delayedCall(400, () => {
        this.input.once('pointerdown', () => this.scene.restart());
        this.input.keyboard.once('keydown-SPACE', () => this.scene.restart());
      });
    }
  }

  // ── onOtherWin ──────────────────────────────────────────────────────────────
  onOtherWin(name) {
    if (this.won) return;
    this.won = true;
    const { width: W, height: H } = this.scale;
    this.add.rectangle(W/2, H/2, 260*RES, 80*RES, 0x200808, 230).setScrollFactor(0);
    this.add.text(W/2, H/2 - 16*RES, `🦀 ${name} WINS!`, {
      fontFamily: 'monospace', fontSize: fs(18),
      color: '#e05050', stroke: '#000', strokeThickness: 4,
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(W/2, H/2 + 16*RES, 'refresh to race again', {
      fontFamily: 'monospace', fontSize: fs(11), color: '#7ec8e3',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setScrollFactor(0);
  }
}

// Phaser.Game is created lazily by startGame() when the user picks a mode.
</script>
</body>
